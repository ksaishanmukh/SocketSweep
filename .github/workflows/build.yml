name: Build SocketSweep

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  # ── Fast gate ─────────────────────────────────────────────────────────────
  # Runs in ~2 minutes on one runner. Without this, a one-character type error
  # fails a ten-minute three-platform bundle build instead of a cheap job.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - run: npm ci

      # Cheapest checks first so the common failures surface fastest.
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

      # tauri-build reads frontendDist, so the frontend must exist before
      # anything touches the Rust crate.
      - run: npm run build

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # crates/daemon is excluded from default-members (it only builds for a
      # Linux-family target), so nothing above would catch a break in it.
      # Writes to src-tauri/bin/daemon, which this job never bundles.
      - name: Verify the device daemon cross-compiles for Android
        run: npm run build:daemon

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── System dependencies (Linux only) ──────────────────────────────────
      # Tauri v2 requires GTK, WebKit, and related libraries on Linux.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf

      # ── Toolchain setup ───────────────────────────────────────────────────
      # Rust is pre-installed on all GitHub Actions runners (ubuntu, windows,
      # macos). No need for dtolnay/rust-toolchain — saves CI time.
      # See: https://github.com/actions/runner-images
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install frontend dependencies
        run: npm ci

      # ── Cross-compile the device daemon for Android aarch64 ───────────────
      # One script on all three hosts, replacing the two per-OS clang steps
      # that used to live here.
      - name: Build device daemon
        run: npm run build:daemon

      # ── Fetch platform-specific ADB from Google ───────────────────────────
      # Same script contributors run locally, so CI and dev can't drift apart.
      - name: Fetch ADB
        run: npm run setup

      # No config patching needed: tauri.{windows,linux,macos}.conf.json declare
      # the per-platform resource names, and Tauri merges them automatically.

      # Only two files carry a version: package.json and the Cargo workspace.
      # tauri.conf.json deliberately omits `version` so it inherits from Cargo.
      - name: Update version from Git tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: node {0}
        run: |
          const fs = require('fs');
          const tag = process.env.GITHUB_REF_NAME;
          const version = tag.startsWith('v') ? tag.slice(1) : tag;

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const cargo = fs.readFileSync('Cargo.toml', 'utf8');
          const patched = cargo.replace(
            /(\[workspace\.package\][\s\S]*?\nversion = ")[^"]*(")/,
            `$1${version}$2`,
          );
          if (patched === cargo) {
            throw new Error('Could not find [workspace.package] version in Cargo.toml');
          }
          fs.writeFileSync('Cargo.toml', patched);

          console.log(`Bumped package.json and Cargo.toml to ${version}`);

      # ── Build Tauri desktop app ───────────────────────────────────────────
      # This single command builds the React frontend (beforeBuildCommand),
      # compiles the Rust bridge, and packages everything into native
      # platform installers (.dmg / .deb / .AppImage / .msi / .exe).
      - name: Build Tauri app
        run: npm run tauri build

      # ── Upload release artifacts ──────────────────────────────────────────
      - name: Upload macOS artifacts
        if: matrix.platform == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: SocketSweep-macOS
          path: target/release/bundle/dmg/*.dmg

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: SocketSweep-Linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage

      - name: Upload Windows artifacts
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: SocketSweep-Windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe

  # ── Create GitHub Release (only on tag push) ─────────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display downloaded files
        run: find artifacts -type f | head -50

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: false
          files: |
            artifacts/SocketSweep-Windows/**/*
            artifacts/SocketSweep-Linux/**/*
            artifacts/SocketSweep-macOS/**/*
