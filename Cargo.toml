[workspace]
resolver = "2"
members = ["src-tauri"]

# Stage 2 adds crates/protocol, crates/scanner and crates/daemon here. The
# daemon targets aarch64-linux-android and must be kept out of `default-members`
# so a plain `cargo build` on the host does not try to build it.

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/ksaishanmukh/SocketSweep"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
