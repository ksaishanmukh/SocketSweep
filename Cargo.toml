[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/protocol",
    "crates/scanner",
    "crates/daemon",
    # v4 contract crates (docs/architecture.md section 1).
    "crates/wire",
    "crates/gui-contract",
    "crates/transport",
    "crates/engine",
    "crates/sim",
    "crates/transport-adb",
    "crates/host-core",
]

# crates/daemon runs on aarch64/x86_64-linux-android, but its session and
# actions are portable (only the rustix Fs and the abstract-socket listener are
# Linux-family), so it builds and tests on every host and is a default member.
# Cross-compile the phone binary with `npm run build:daemon`.
default-members = [
    "crates/daemon",
    "src-tauri",
    "crates/protocol",
    "crates/scanner",
    "crates/wire",
    "crates/gui-contract",
    "crates/transport",
    "crates/engine",
    "crates/sim",
    "crates/transport-adb",
    "crates/host-core",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-3.0"
repository = "https://github.com/ksaishanmukh/SocketSweep"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }
jwalk = "0.8"
socketsweep-protocol = { path = "crates/protocol" }
socketsweep-scanner = { path = "crates/scanner" }
socketsweep-wire = { path = "crates/wire" }
socketsweep-gui-contract = { path = "crates/gui-contract" }
socketsweep-transport = { path = "crates/transport" }
socketsweep-engine = { path = "crates/engine" }
socketsweep-sim = { path = "crates/sim" }
socketsweep-transport-adb = { path = "crates/transport-adb" }
socketsweep-host-core = { path = "crates/host-core" }
socketsweep-daemon = { path = "crates/daemon" }
bitflags = { version = "2.13", features = ["serde"] }
# Pinned exactly: specta 2 is still a release candidate and its RCs break each
# other. These are the versions tauri-specta 2.0.0-rc.26 is built against, so
# src-tauri can adopt tauri-specta without the contract crate changing.
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-serde = "=0.0.13"
specta-typescript = "=0.0.13"

# The daemon is pushed to a phone over USB on every connect, so size is a
# user-visible cost, not just a build detail.
[profile.release-daemon]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
