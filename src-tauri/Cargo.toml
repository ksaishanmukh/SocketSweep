[package]
name = "socketsweep"
description = "Fast Android storage analyzer that bypasses MTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix is required: on Windows the lib name must not collide with
# the bin name. See https://github.com/rust-lang/cargo/issues/8519
name = "socketsweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
