[package]
name = "socketsweep"
description = "Fast Android storage analyzer that bypasses MTP"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# The `_lib` suffix is required: on Windows the lib name must not collide with
# the bin name. See https://github.com/rust-lang/cargo/issues/8519
name = "socketsweep_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
specta.workspace = true
specta-typescript.workspace = true
tauri-specta.workspace = true
socketsweep-gui-contract = { workspace = true, features = ["tauri"] }
socketsweep-host-core.workspace = true
socketsweep-transport-adb.workspace = true

[lints.clippy]
excessive_nesting = "warn"
